<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>가록 — 새 주소로 옮겼습니다</title>
<script>
(function(){var o={},n=0;try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);o[k]=localStorage.getItem(k);n++}}catch(e){}
var t='https://galog.kr'+location.pathname+location.search,h=location.hash.replace(/^#/,''),b='';
try{if(n){var u=new TextEncoder().encode(JSON.stringify(o)),s='';for(var j=0;j<u.length;j++)s+=String.fromCharCode(u[j]);b=btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');if(b.length>1500000)b=''}}catch(e){b=''}
var f=h;if(b)f=(f?f+'&':'')+'ds-move='+b;location.replace(t+(f?'#'+f:''))})();
</script>
<meta http-equiv="refresh" content="3;url=https://galog.kr/">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F3EEE3;color:#1F1B16;font-family:system-ui,'Apple SD Gothic Neo',sans-serif;text-align:center}a{color:#A8432F}</style>
</head><body><p>가록이 새 주소로 옮겼습니다.<br><a href="https://galog.kr/">galog.kr 로 가기</a></p></body></html>
